name: Validate One-Shot Forge

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript syntax
        run: node --check app.js
      - name: Validate reference adventure
        run: node scripts/validate-adventure.mjs data/adventures/the-lantern-below.oneshot.json
