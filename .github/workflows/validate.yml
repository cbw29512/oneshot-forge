name: Validate One-Shot Forge

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Persist authored finale integration
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/finale-procedure-certification'
        run: |
          node scripts/integrate-finale-procedure.mjs data/adventures/the-lantern-below.oneshot.json data/adventures/the-lantern-below.old-flame.json --write
          if git diff --quiet; then
            echo "Finale integration already authoritative."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/adventures/the-lantern-below.oneshot.json data/adventures/the-lantern-below.old-flame.json
            git commit -m "content: integrate Old Flame into Lantern finale"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check generator.js
          node --check module.js
          node --check quickrun.js
          node --check rules.js
      - name: Validate authored adventures
        run: |
          node scripts/validate-adventure.mjs data/adventures/the-lantern-below.oneshot.json
          node scripts/validate-adventure.mjs data/adventures/the-well-that-would-not-dry.oneshot.json
      - name: Certify zero-prep stage cards
        run: |
          node scripts/validate-stage-cards.mjs data/adventures/the-lantern-below.oneshot.json
          node scripts/validate-stage-cards.mjs data/adventures/the-well-that-would-not-dry.oneshot.json
      - name: Validate quick-run reference
        run: node -e "const fs=require('fs'); const q=JSON.parse(fs.readFileSync('data/adventures/the-lantern-below.quickrun.json','utf8')); if(q.adventureId!=='the-lantern-below'||!q.encounters?.length||!q.checks?.length||!q.rewards?.length||!q.mapNotes?.length) process.exit(1); console.log('Quick-run reference OK')"
      - name: Prevent embedded/sidecar quick-run drift
        run: node scripts/validate-quickrun-sync.mjs data/adventures/the-lantern-below.oneshot.json data/adventures/the-lantern-below.quickrun.json
      - name: Certify Lantern play routes
        run: node scripts/validate-routes.mjs data/adventures/the-lantern-below.oneshot.json data/adventures/the-lantern-below.routes.json
      - name: Certify finale procedures are runnable in-stage
        run: node scripts/validate-finale-procedures.mjs data/adventures/the-lantern-below.oneshot.json data/adventures/the-lantern-below.old-flame.json
      - name: Smoke-test random generator
        run: node scripts/smoke-generator.cjs
      - name: Smoke-test product pages and links
        run: node scripts/smoke-site.mjs
      - name: Contrast token
        run: node -e "const s=require('fs').readFileSync('styles.css','utf8'); if(!/--fg-subtle:\\s*#a3988c/.test(s)) { console.error('fg-subtle must stay AA'); process.exit(1);} console.log('contrast token OK')"
