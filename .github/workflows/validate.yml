name: Validate One-Shot Forge

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check cards.js
          node --check generator.js
          node --check forge-bones.js
          node --check forge-flesh.js
          node --check module.js
          node --check quickrun.js
          node --check rules.js
          node --check adventure-registry.js
      - name: Validate authored adventures
        run: |
          node scripts/validate-adventure.mjs data/adventures/the-lantern-below.oneshot.json
          node scripts/validate-adventure.mjs data/adventures/the-well-that-would-not-dry.oneshot.json
          node scripts/validate-adventure.mjs data/adventures/the-owlbear-egg.oneshot.json
          node scripts/validate-adventure.mjs data/adventures/whispers-of-the-oakhaven-hollow.oneshot.json
          node scripts/validate-adventure.mjs data/adventures/beneath-the-eastern-watchtower.oneshot.json
      - name: Certify zero-prep stage cards
        run: |
          node scripts/validate-stage-cards.mjs data/adventures/the-lantern-below.oneshot.json
          node scripts/validate-stage-cards.mjs data/adventures/the-well-that-would-not-dry.oneshot.json
          node scripts/validate-stage-cards.mjs data/adventures/the-owlbear-egg.oneshot.json
          node scripts/validate-stage-cards.mjs data/adventures/whispers-of-the-oakhaven-hollow.oneshot.json
          node scripts/validate-stage-cards.mjs data/adventures/beneath-the-eastern-watchtower.oneshot.json
      - name: Audit Lantern GM table readiness
        run: node scripts/validate-table-readiness.mjs data/adventures/the-lantern-below.oneshot.json
      - name: Audit Lantern clue delivery
        run: node scripts/validate-clue-delivery.mjs data/adventures/the-lantern-below.oneshot.json
      - name: Audit Owlbear table readiness
        run: node scripts/validate-table-readiness.mjs data/adventures/the-owlbear-egg.oneshot.json
      - name: Audit Owlbear clue delivery
        run: node scripts/validate-clue-delivery.mjs data/adventures/the-owlbear-egg.oneshot.json
      - name: Audit Oakhaven table readiness
        run: node scripts/validate-table-readiness.mjs data/adventures/whispers-of-the-oakhaven-hollow.oneshot.json
      - name: Audit Oakhaven clue delivery
        run: node scripts/validate-clue-delivery.mjs data/adventures/whispers-of-the-oakhaven-hollow.oneshot.json
      - name: Audit Oakhaven spoken presentation
        run: node scripts/validate-presentation.mjs data/adventures/whispers-of-the-oakhaven-hollow.oneshot.json
      - name: Audit Watchtower table readiness
        run: node scripts/validate-table-readiness.mjs data/adventures/beneath-the-eastern-watchtower.oneshot.json
      - name: Audit Watchtower clue delivery
        run: node scripts/validate-clue-delivery.mjs data/adventures/beneath-the-eastern-watchtower.oneshot.json
      - name: Audit Watchtower spoken presentation
        run: node scripts/validate-presentation.mjs data/adventures/beneath-the-eastern-watchtower.oneshot.json
      - name: Validate adventure registry
        run: node scripts/validate-adventure-registry.mjs
      - name: Audit Owlbear spoken presentation
        run: node scripts/validate-presentation.mjs data/adventures/the-owlbear-egg.oneshot.json
      - name: Validate Owlbear printable cards
        run: node scripts/validate-cards.mjs data/adventures/the-owlbear-egg.oneshot.json
      - name: Validate printable pregen packets
        run: node scripts/validate-pregen-print.mjs
      - name: Certify active stage-card rendering
        run: node scripts/validate-runner-zero-prep.mjs
      - name: Certify guided Owlbear run flow
        run: node scripts/validate-guided-flow.mjs data/adventures/the-owlbear-egg.oneshot.json
      - name: Validate quick-run reference
        run: node -e "const fs=require('fs'); const q=JSON.parse(fs.readFileSync('data/adventures/the-lantern-below.quickrun.json','utf8')); if(q.adventureId!=='the-lantern-below'||!q.encounters?.length||!q.checks?.length||!q.rewards?.length||!q.mapNotes?.length) process.exit(1); console.log('Quick-run reference OK')"
      - name: Prevent embedded/sidecar quick-run drift
        run: node scripts/validate-quickrun-sync.mjs data/adventures/the-lantern-below.oneshot.json data/adventures/the-lantern-below.quickrun.json
      - name: Certify Lantern play routes
        run: node scripts/validate-routes.mjs data/adventures/the-lantern-below.oneshot.json data/adventures/the-lantern-below.routes.json
      - name: Certify finale procedures are runnable in-stage
        run: node scripts/validate-finale-procedures.mjs data/adventures/the-lantern-below.oneshot.json data/adventures/the-lantern-below.old-flame.json
      - name: Smoke-test random generator
        run: node scripts/smoke-generator.cjs
      - name: Validate Forge bones and AI boundary
        run: node scripts/smoke-forge-bones.cjs
      - name: Smoke-test product pages and links
        run: node scripts/smoke-site.mjs
      - name: Contrast token
        run: node -e "const s=require('fs').readFileSync('styles.css','utf8'); if(!/--fg-subtle:\\s*#a3988c/.test(s)) { console.error('fg-subtle must stay AA'); process.exit(1);} console.log('contrast token OK')"
