<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Adventure Cards — One-Shot Forge</title>
  <link rel="icon" href="assets/mark-lantern.jpg">
  <link rel="stylesheet" href="styles.css?v=20260926b">
  <style>
    body.cards-page{background:#eee9df;color:#17130f}
    .cards-toolbar{position:sticky;top:0;z-index:5;display:flex;gap:.75rem;align-items:center;padding:.75rem 1rem;background:#17130f;color:#fff;border-bottom:1px solid #444}
    .cards-toolbar h1{font-size:1rem;margin:0 auto 0 0}
    .cards-shell{max-width:1200px;margin:0 auto;padding:1.25rem}
    .card-pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:1rem}
    .print-card{background:#fffdf7;color:#17130f;border:2px solid #2c2418;border-radius:14px;min-height:4.75in;aspect-ratio:2.75/4.75;padding:.22in;display:flex;flex-direction:column;box-shadow:0 8px 24px #0002}
    .print-card .eyebrow{color:#7d351b}.print-card h2{font-size:1.55rem;margin:.05in 0 .12in}.print-card h3{margin:.08in 0;font-size:.9rem;text-transform:uppercase;letter-spacing:.06em}
    .front-art{flex:1;display:grid;place-items:center;border:1px solid #b9aa92;border-radius:10px;padding:.18in;text-align:center;font-family:Georgia,serif;font-size:1.1rem;background:#f5eddf}
    .back-list{padding-left:.18in;margin:.05in 0}.back-list li{margin:.06in 0;line-height:1.25}.statline-card{font-weight:800;border-top:2px solid #2c2418;border-bottom:2px solid #2c2418;padding:.07in 0;margin:.08in 0}
    .pair-label{grid-column:1/-1;font-weight:800;margin-top:.5rem}
    @media print{
      .cards-toolbar{display:none!important}.cards-shell{max-width:none;padding:0}.card-pairs{display:grid;grid-template-columns:2.75in 2.75in;gap:.18in;justify-content:center}
      .print-card{width:2.75in;height:4.75in;min-height:0;box-shadow:none;break-inside:avoid;page-break-inside:avoid}
      .pair-label{display:none}body.cards-page{background:#fff}
    }
  </style>
</head>
<body class="cards-page">
  <header class="cards-toolbar">
    <h1 id="cards-title">Adventure Cards</h1>
    <a class="button secondary small" id="back-link" href="run.html">GM table</a>
    <button class="button small" id="print-cards" type="button">Print cards</button>
  </header>
  <main class="cards-shell">
    <p id="cards-meta"></p>
    <div id="card-pairs" class="card-pairs" aria-live="polite"></div>
  </main>
  <script src="cards.js?v=20260926b"></script>
</body>
</html>
