<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
<rect width="800" height="500" fill="#f4efe2" stroke="#2a241c" stroke-width="4"/>
<text x="40" y="60" font-family="Georgia" font-size="24" fill="#2a241c">Widow's Grin manifest</text>
<text x="40" y="110" font-family="Georgia" font-size="16" fill="#2a241c">First keel: black oak, cut before the oath.</text>
<text x="40" y="142" font-family="Georgia" font-size="16" fill="#2a241c">New ribs, new deck, and new figurehead were laid after.</text>
<text x="40" y="174" font-family="Georgia" font-size="16" fill="#2a241c">New wood does not remember.</text>
<text x="40" y="206" font-family="Georgia" font-size="16" fill="#2a241c">Only the first keel does.</text>
<text x="40" y="238" font-family="Georgia" font-size="16" fill="#2a241c">The keel is still in the wreck.</text>
<text x="40" y="270" font-family="Georgia" font-size="16" fill="#2a241c">A trophy splinter is in the palace. A shard is on the beach.</text>
</svg>