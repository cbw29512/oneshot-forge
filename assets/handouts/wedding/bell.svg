<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
<rect width="800" height="500" fill="#f4efe2" stroke="#2a241c" stroke-width="4"/>
<text x="40" y="60" font-family="Georgia" font-size="24" fill="#2a241c">Inscription on the drowned bell</text>
<text x="40" y="110" font-family="Georgia" font-size="16" fill="#2a241c">Serevath, the Tide That Returns.</text>
<text x="40" y="142" font-family="Georgia" font-size="16" fill="#2a241c">A broken tide comes back to the morning it left.</text>
<text x="40" y="174" font-family="Georgia" font-size="16" fill="#2a241c">The last body is chained.</text>
<text x="40" y="206" font-family="Georgia" font-size="16" fill="#2a241c">Weapons do not finish a god.</text>
<text x="40" y="238" font-family="Georgia" font-size="16" fill="#2a241c">The first keel finishes the theft.</text>
<text x="40" y="270" font-family="Georgia" font-size="16" fill="#2a241c">One wound is not the end.</text>
</svg>