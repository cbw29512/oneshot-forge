<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
<rect width="800" height="500" fill="#f4efe2" stroke="#2a241c" stroke-width="4"/>
<text x="40" y="60" font-family="Georgia" font-size="24" fill="#2a241c">Note tied to the cane</text>
<text x="40" y="110" font-family="Georgia" font-size="16" fill="#2a241c">Cut from the first keel.</text>
<text x="40" y="142" font-family="Georgia" font-size="16" fill="#2a241c">One touch ends the coat.</text>
<text x="40" y="174" font-family="Georgia" font-size="16" fill="#2a241c">The second touch must find him under the water.</text>
<text x="40" y="206" font-family="Georgia" font-size="16" fill="#2a241c">Then he must fall.</text>
<text x="40" y="238" font-family="Georgia" font-size="16" fill="#2a241c">The body in the chain is Serevath.</text>
<text x="40" y="270" font-family="Georgia" font-size="16" fill="#2a241c">Do not fight it. Death there is the morning, again.</text>
</svg>