<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
<rect width="800" height="500" fill="#f4efe2" stroke="#2a241c" stroke-width="4"/>
<text x="40" y="60" font-family="Georgia" font-size="24" fill="#2a241c">Shoal warning</text>
<text x="40" y="110" font-family="Georgia" font-size="16" fill="#2a241c">IF YOU STRIKE THE BODY UNDER THE BELL,</text>
<text x="40" y="142" font-family="Georgia" font-size="16" fill="#2a241c">EVERYONE DIES.</text>
<text x="40" y="174" font-family="Georgia" font-size="16" fill="#2a241c">THE TIDE PUTS YOU BACK ON THE FERRY.</text>
<text x="40" y="206" font-family="Georgia" font-size="16" fill="#2a241c">THAT IS NOT A VICTORY.</text>
<text x="40" y="238" font-family="Georgia" font-size="16" fill="#2a241c">IT IS NOT THE END.</text>
<text x="40" y="270" font-family="Georgia" font-size="16" fill="#2a241c">PUT THE WEAPONS DOWN.</text>
</svg>