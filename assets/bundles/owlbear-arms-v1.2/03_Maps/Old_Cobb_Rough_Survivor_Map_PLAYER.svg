<title id="t">Old Cobb's rough trail sketch — player handout</title><desc id="d">A crude survivor sketch with a trail from Brindlebarrow to a cave, an X showing where Cobb last saw Tomas, uncertain detours and a warning about bells. It contains no internal lair rooms or hidden information.</desc>
