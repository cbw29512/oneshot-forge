<text x="72" y="102" font-size="39" transform="rotate(-3 72 102)">COBB'S SCRATCH MAP</text>
<path d="M75 114 q191 -13 363 -8" stroke="#553927" stroke-width="4" fill="none"/>
<text x="78" y="145" font-size="21" transform="rotate(-2 78 145)">Drawn from memory. Not to scale.</text>
<text x="70" y="782" font-size="35" transform="rotate(-7 70 782)">BRINDLEBARROW</text>
<text x="91" y="817" font-size="17" transform="rotate(-4 91 817)">This way home  &lt;---</text>
<text x="572" y="331" font-size="31" transform="rotate(-8 572 331)">LAST SAW TOMAS</text>
<text x="649" y="358" font-size="21" transform="rotate(-7 649 358)">we split up here</text>
<text x="865" y="105" font-size="42" transform="rotate(7 865 105)">CAVE</text>
<text x="864" y="135" font-size="21" transform="rotate(5 864 135)">owlbear territory?</text>
<text x="845" y="326" font-size="32" transform="rotate(-5 845 326)">BELLS!!</text>
<text x="777" y="352" font-size="22" transform="rotate(-6 777 352)">watch your step</text>
<text x="177" y="470" font-size="28" transform="rotate(-9 177 470)">WRONG WAY?</text>
<text x="152" y="493" font-size="21" transform="rotate(-8 152 493)">didn't take this trail</text>
<text x="687" y="619" font-size="25" transform="rotate(4 687 619)">Didn't go inside.</text>
<text x="704" y="645" font-size="19" transform="rotate(3 704 645)">No idea what's past the gate.</text>
<text x="277" y="746" font-size="23" transform="rotate(2 277 746)">KEEP QUIET.</text>
