<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
<title id="title">Ashhouse mortar handout</title>
<desc id="desc">Player handout showing three scoops and the maintenance verse: two white to bind, one black to drink, water until the trough stands still.</desc>
<rect width="900" height="600" fill="#f4f0e6"/>
<rect x="75" y="85" width="750" height="430" rx="24" fill="#e4dfd3" stroke="#3e3d39" stroke-width="6"/>
<g stroke="#333" stroke-width="5">
<rect x="150" y="180" width="120" height="160" rx="18" fill="#f7f7f4"/>
<rect x="390" y="180" width="120" height="160" rx="18" fill="#555"/>
<rect x="630" y="180" width="120" height="160" rx="18" fill="#c9b999"/>
</g>
<text x="175" y="375" font-family="sans-serif" font-size="24">LIME</text>
<text x="408" y="375" font-family="sans-serif" font-size="24">CHAR ASH</text>
<text x="662" y="375" font-family="sans-serif" font-size="24">WATER</text>
<text x="180" y="115" font-family="serif" font-size="30">TWO WHITE TO BIND</text>
<text x="205" y="445" font-family="serif" font-size="30">ONE BLACK TO DRINK</text>
<text x="150" y="490" font-family="serif" font-size="30">WATER UNTIL THE TROUGH STANDS STILL</text>
</svg>