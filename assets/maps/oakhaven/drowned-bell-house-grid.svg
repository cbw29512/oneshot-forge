</g>
<rect x="60" y="60" width="600" height="600" fill="#dfe5e6" stroke="#333" stroke-width="8"/>
<circle cx="360" cy="210" r="90" fill="#c5bda9" stroke="#3a3935" stroke-width="8"/>
