<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>One-Shot Forge — Pregen sheets</title>
  <link rel="icon" href="assets/mark-lantern.jpg">
  <link rel="stylesheet" href="styles.css?v=20260920j">
</head>
<body class="sheets-page">
  <header class="land-bar print-hide">
    <a class="brand" href="./">
      <img src="assets/mark-lantern.jpg" alt="" width="36" height="36">
      <span>One-Shot Forge</span>
    </a>
    <nav class="land-nav">
      <a href="./">Home</a>
      <a href="run.html">GM table</a>
      <button class="button ember small" type="button" onclick="window.print()">Print sheets</button>
    </nav>
  </header>
  <main class="sheets-wrap">
    <section class="print-hide land-section" style="border-top:0">
      <p class="eyebrow ember">Tonight’s six · print these</p>
      <h1>Character sheets</h1>
      <p class="lede short">D&D Beyond cannot import these. Print them, or use the Beyond checklist on each sheet and type them in by hand. Twelve classes live in the JSON; these six are the table.</p>
    </section>
    <div id="sheets"></div>
  </main>
  <script>
    const scoresOrder = ["STR","DEX","CON","INT","WIS","CHA"];
    function esc(v) {
      return String(v == null ? "" : v)
        .replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">");
    }
    function beyondChecklist(pc) {
      const lines = [
        "D&D Beyond builder — type this in by hand. There is no import.",
        "Species: " + (pc.race || ""),
        "Class & level: " + (pc.class || "") + " 4",
        "Background: " + (pc.background || "choose closest SRD"),
        "Ability scores: " + scoresOrder.map(k => k + " " + (pc.scores||{})[k]).join(", "),
        "Armor / HP: AC " + pc.ac + ", HP " + pc.hp,
        pc.spellcasting ? ("Spells: " + [].concat(pc.spellcasting.cantrips||[], pc.spellcasting.prepared||[]).join(", ")) : "No spells"
      ];
      return lines.join("\n");
    }
    function sheetHtml(pc) {
      const scores = scoresOrder.map(k =>
        '<span>' + k + ' <b>' + esc((pc.scores||{})[k]) + '</b></span>'
      ).join("");
      const spells = pc.spellcasting
        ? '<p><b>Spellcasting.</b> ' + esc(pc.spellcasting.ability) +
          ' DC ' + esc(pc.spellcasting.saveDC) + ', +' + esc(pc.spellcasting.attack) +
          '. Slots: ' + esc(pc.spellcasting.slots) + '</p>' +
          (pc.spellcasting.cantrips?.length ? '<p>Cantrips: ' + esc(pc.spellcasting.cantrips.join(", ")) + '</p>' : '') +
          (pc.spellcasting.prepared?.length ? '<p>Prepared: ' + esc(pc.spellcasting.prepared.join(", ")) + '</p>' : '')
        : "";
      const img = pc.portrait
        ? '<img class="sheet-portrait" src="' + esc(pc.portrait) + '" alt="">'
        : "";
      return '<article class="sheet" id="' + esc(pc.id) + '">' +
        img +
        '<div class="sheet-body">' +
        '<p class="eyebrow">' + esc(pc.rules || "5E 2014 SRD") + '</p>' +
        '<h2>' + esc(pc.name) + '</h2>' +
        '<p>' + esc(pc.race) + ' · ' + esc(pc.class) +
        (pc.background ? ' · ' + esc(pc.background) : '') +
        ' · ' + esc(pc.role) + '</p>' +
        '<div class="stat-strip">' +
        '<span>AC <b>' + esc(pc.ac) + '</b></span>' +
        '<span>HP <b>' + esc(pc.hp) + '</b></span>' +
        '<span>Speed <b>' + esc(pc.speed) + '</b></span>' +
        '<span>Prof <b>+' + esc(pc.proficiency) + '</b></span>' +
        '</div>' +
        '<div class="stat-strip">' + scores + '</div>' +
        '<p><b>Saves.</b> ' + esc(pc.saves) + '</p>' +
        '<p><b>Skills.</b> ' + esc(pc.skills) + '</p>' +
        (pc.attacks||[]).map(line => '<p>' + esc(line) + '</p>').join('') +
        spells +
        (pc.features||[]).map(line => '<p class="tiny">' + esc(line) + '</p>').join('') +
        '<p class="muted">' + esc(pc.gear || "") + '</p>' +
        '<pre class="beyond-check">' + esc(beyondChecklist(pc)) + '</pre>' +
        '</div></article>';
    }
    fetch("data/pregens/quiet-seals-level-4-2014-srd.json")
      .then(r => r.json())
      .then(pack => {
        const rec = (pack.characters || []).filter(pc => pc.recommended);
        const rest = (pack.characters || []).filter(pc => !pc.recommended);
        document.getElementById("sheets").innerHTML =
          rec.map(sheetHtml).join("") +
          '<h2 class="print-hide" style="padding:1rem 2rem 0">The other six, if you need them</h2>' +
          rest.map(sheetHtml).join("");
      })
      .catch(() => {
        document.getElementById("sheets").innerHTML = "<p>Could not load pregens.</p>";
      });
  </script>
</body>
</html>
