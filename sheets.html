<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>One-Shot Forge — Character sheets</title>
  <link rel="icon" href="assets/mark-lantern.jpg">
  <link rel="stylesheet" href="styles.css?v=20260926-sheet3">
</head>
<body class="sheets-page">
  <header class="land-bar print-hide">
    <a class="brand" href="./">
      <img src="assets/mark-lantern.jpg" alt="" width="36" height="36">
      <span>One-Shot Forge</span>
    </a>
    <nav class="land-nav">
      <span id="ruleset-host"></span>
      <a href="./">Home</a>
      <a href="campaign.html">Town</a>
      <a href="run.html">GM table</a>
      <button class="button ember small" type="button" onclick="window.print()">Print all</button>
    </nav>
  </header>
  <main class="sheets-wrap">
    <section class="print-hide land-section" style="border-top:0">
      <p class="eyebrow ember">Table-complete · 2014 SRD · level 4</p>
      <h1>Character sheets</h1>
      <p class="lede short">Click <b>2014 SRD</b> or <b>2024 SRD</b> at the top. Same six people, rebuilt on that edition. Beyond cannot import them. Print them.</p>
    </section>
    <div id="sheets"></div>
  </main>
  <script src="rules.js?v=20260920n"></script>
  <script>mountRulesetToggle(document.getElementById("ruleset-host"));</script>
  <script>
    function waitImagesThenPrint(root) {
      const imgs = [...(root || document).querySelectorAll("img")];
      const pending = imgs.filter(i => !i.complete);
      let done = false;
      const go = () => { if (done) return; done = true; window.print(); };
      if (!pending.length) { setTimeout(go, 200); return; }
      let n = pending.length;
      const tick = () => { if (--n <= 0) go(); };
      pending.forEach(i => { i.addEventListener("load", tick); i.addEventListener("error", tick); });
      setTimeout(go, 3000);
    }
    function autoPrintIfRequested() {
      if (new URLSearchParams(location.search).get("print") === "1") waitImagesThenPrint();
    }
    const ABIL = ["STR","DEX","CON","INT","WIS","CHA"];
    const SKILL_ORDER = [
      "acrobatics","animal handling","arcana","athletics","deception","history",
      "insight","intimidation","investigation","medicine","nature","perception",
      "performance","persuasion","religion","sleight of hand","stealth","survival"
    ];
    function esc(v) {
      return String(v == null ? "" : v)
        .replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">");
    }
    function signed(n) {
      n = Number(n) || 0;
      return (n >= 0 ? "+" : "") + n;
    }
    function mod(score) { return Math.floor(((Number(score) || 10) - 10) / 2); }
    function skillRows(map) {
      if (!map) return "";
      return SKILL_ORDER.map(name => {
        const s = map[name] || {};
        const mark = s.expertise ? "●●" : s.proficient ? "●" : "○";
        return '<div class="sk' + (s.proficient ? " on" : "") + '"><i>' + mark +
          "</i><b>" + signed(s.bonus) + "</b><span>" + name + "</span></div>";
      }).join("");
    }
    function saveRows(map, scores) {
      return ABIL.map(k => {
        const s = (map && map[k]) || { bonus: mod((scores||{})[k]), proficient: false };
        return '<div class="sv' + (s.proficient ? " on" : "") + '"><i>' +
          (s.proficient ? "●" : "○") + "</i><b>" + signed(s.bonus) + "</b><span>" + k + "</span></div>";
      }).join("");
    }
    function scoreCol(pc) {
      return ABIL.map(k => {
        const score = (pc.scores || {})[k];
        return '<div class="ab"><span>' + k + "</span><strong>" + esc(score) +
          "</strong><em>" + signed(mod(score)) + "</em></div>";
      }).join("");
    }
    function attackTable(list) {
      if (!list || !list.length) return "";
      return '<table class="atk"><thead><tr><th>Attack</th><th>Hit</th><th>Damage</th></tr></thead><tbody>' +
        list.map(a => "<tr><td>" + esc(a.name) + (a.notes ? '<div class="tiny">' + esc(a.notes) + "</div>" : "") +
          "</td><td>" + signed(a.bonus) + "</td><td>" + esc(a.damage) + " " + esc(a.type) + "</td></tr>").join("") +
        "</tbody></table>";
    }
    function listBlock(title, arr) {
      if (!arr || !arr.length) return "";
      return "<h3>" + esc(title) + "</h3><ul>" + arr.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>";
    }
    function spellBlock(pc) {
      const list = pc.spellList;
      if (!list || !list.length) return "";
      const sc = pc.spellcasting || {};
      const slots = sc.slots || {};
      const slotLine = Object.keys(slots).map(l => "L" + l + " × " + slots[l]).join(" · ");
      const groups = {};
      list.forEach(s => {
        const k = s.level === 0 ? "Cantrips" : "Level " + s.level;
        (groups[k] = groups[k] || []).push(s);
      });
      let html = '<section class="cs-spells"><h3>Spellcasting</h3><p class="cs-slot">' +
        esc(sc.ability || "") + " · DC " + esc(sc.saveDC) + " · attack " + signed(sc.attack) +
        (slotLine ? " · slots " + esc(slotLine) : "") +
        (sc.prepareCount ? '<span class="tiny"> · ' + esc(sc.prepareCount) + "</span>" : "") +
        "</p>";
      for (const [k, arr] of Object.entries(groups)) {
        html += "<h4>" + esc(k) + "</h4>";
        html += arr.map(s => '<div class="spl"><b>' + esc(s.name) + "</b> <span>" +
          esc(s.time) + " · " + esc(s.range) +
          (s.save ? " · " + esc(s.save) : "") +
          "</span><p>" + esc(s.effect) + "</p></div>").join("");
      }
      return html + "</section>";
    }
    function characterClass(pc) {
      return pc.className || pc.class || "Adventurer";
    }
    function beyondList(pc) {
      const sk = pc.skillsMap || {};
      const profSkills = Object.keys(sk).filter(k => sk[k].proficient).join(", ");
      const spells = (pc.spellList || []).map(s => s.name).join(", ");
      return [
        "D&D Beyond has no character import. Type this by hand if you must.",
        "Species: " + (pc.race || ""),
        "Class: " + characterClass(pc) + " 4",
        "Background: " + (pc.background || ""),
        "Scores: " + ABIL.map(k => k + " " + (pc.scores||{})[k]).join(", "),
        "Skills: " + profSkills,
        spells ? "Spells: " + spells : ""
      ].filter(Boolean).join("\n");
    }
    function sheetHtml(pc) {
      const className = characterClass(pc);
      const img = pc.portrait
        ? '<img class="cs-port" src="' + esc(pc.portrait) + '" alt="Portrait of ' + esc(pc.name) + '">'
        : '<div class="cs-port ph" aria-hidden="true"></div>';
      const prof = pc.proficiencies || {};
      const pers = pc.personality || {};
      const printHref = "sheets.html?rules=" + encodeURIComponent(edition) + "&print=1&pc=" + encodeURIComponent(pc.id);
      return '<article class="cs screen-sheet" id="' + esc(pc.id) + '">' +
        '<div class="cs-screen-actions print-hide"><a class="button small secondary" href="' + printHref + '">Print this character</a></div>' +
        '<div class="cs-print-mark" aria-hidden="true"><span>ONE-SHOT FORGE</span><span>PLAYER CHARACTER</span></div>' +
        '<header class="cs-top">' + img +
        '<div class="cs-id">' +
          '<p class="eyebrow">' + esc(pc.rules || "5E 2014 SRD") + " · Level 4 · XP " + esc(pc.xp || 2700) + "</p>" +
          "<h2>" + esc(pc.name) + "</h2>" +
          "<p><b>" + esc(className) + " 4</b> · " + esc(pc.race) + " · " + esc(pc.background || "") +
          " · " + esc(pc.alignment || "") + "</p>" +
          (pc.role ? '<p class="cs-role">' + esc(pc.role) + '</p>' : '') +
        "</div>" +
        '<div class="cs-combat">' +
          '<div><span>Armor Class</span><b>' + esc(pc.ac) + "</b><small>" + esc(pc.acNotes || "") + "</small></div>" +
          '<div><span>Initiative</span><b>' + signed(pc.initiative) + "</b></div>" +
          '<div><span>Speed</span><b>' + esc(pc.speedFt || pc.speed) + "</b></div>" +
          '<div><span>Hit Points</span><b>' + esc(pc.hp) + "</b><small>" + esc(pc.hitDice || "") + "</small></div>" +
          '<div><span>Proficiency</span><b>+' + esc(pc.proficiency || 2) + "</b></div>" +
          '<div><span>Passive Wis (Per)</span><b>' + esc(pc.passivePerception) + "</b></div>" +
        "</div></header>" +
        '<div class="cs-grid">' +
          '<section><h3>Abilities</h3><div class="ab-row">' + scoreCol(pc) + "</div>" +
            "<h3>Saves</h3>" + saveRows(pc.saveMap, pc.scores) +
            "<h3>Skills</h3>" + skillRows(pc.skillsMap) +
          "</section>" +
          "<section><h3>Attacks</h3>" + attackTable(pc.attackList) +
            listBlock("Bonus actions", pc.bonusActions) +
            listBlock("Reactions", pc.reactions) +
            "<h3>Senses & proficiencies</h3>" +
            "<p>Darkvision " + esc(pc.darkvision || 0) + " ft. · Passive Insight " + esc(pc.passiveInsight) + "</p>" +
            "<p><b>Armor.</b> " + esc((prof.armor||[]).join(", ") || "none") + "</p>" +
            "<p><b>Weapons.</b> " + esc((prof.weapons||[]).join(", ")) + "</p>" +
            "<p><b>Tools.</b> " + esc((prof.tools||[]).join(", ") || "—") + "</p>" +
            "<p><b>Languages.</b> " + esc((prof.languages||[]).join(", ")) + "</p>" +
          "</section>" +
          "<section><h3>Personality</h3>" +
            "<p><b>Trait.</b> " + esc(pers.trait || "") + "</p>" +
            "<p><b>Ideal.</b> " + esc(pers.ideal || "") + "</p>" +
            "<p><b>Bond.</b> " + esc(pers.bond || "") + "</p>" +
            "<p><b>Flaw.</b> " + esc(pers.flaw || "") + "</p>" +
            "<p class='tiny'>" + esc(pc.appearance || "") + "</p>" +
            "<h3>Equipment</h3><p>" + esc(pc.gear || "") + "</p>" +
          "</section>" +
        "</div>" +
        '<section class="cs-feat"><h3>Features & traits</h3>' +
          (pc.featureList||[]).map(f => '<div class="ft"><b>' + esc(f.name) +
            "</b> <span>" + esc(f.source) + (f.uses ? " · " + esc(f.uses) : "") +
            "</span><p>" + esc(f.text) + "</p></div>").join("") +
        "</section>" +
        spellBlock(pc) +
        '<pre class="beyond-check print-hide">' + esc(beyondList(pc)) + "</pre>" +
      "</article>";
    }

    function compactList(arr) {
      if (!arr || !arr.length) return '<span class="dash">—</span>';
      return arr.map(x => '<div class="pr-line">' + esc(x) + '</div>').join("");
    }
    function printFeatureRows(pc) {
      return (pc.featureList || []).map(f =>
        '<div class="pr-feature"><b>' + esc(f.name) + '</b>' +
        (f.uses ? '<span> · ' + esc(f.uses) + '</span>' : '') +
        '<p>' + esc(f.text) + '</p></div>'
      ).join("");
    }
    function limitedUseRows(pc) {
      const seen = new Set();
      const rows = [];
      for (const feature of (pc.featureList || [])) {
        const uses = String(feature.uses || "").trim();
        if (!uses || /already applied|passive|at will/i.test(uses)) continue;
        const key = feature.name + "|" + uses;
        if (seen.has(key)) continue;
        seen.add(key);
        rows.push('<div class="pr-resource"><b>' + esc(feature.name) + '</b><span>' + esc(uses) + '</span><em>□ □ □ □ □</em></div>');
      }
      return rows.length ? rows.join("") : '<div class="pr-line">No limited-use class resource to track.</div>';
    }
    function fullSaveRows(pc) {
      return ABIL.map(k => {
        const score = (pc.scores || {})[k];
        const s = (pc.saveMap && pc.saveMap[k]) || { bonus: mod(score), proficient: false };
        return '<div class="pr-save"><span class="pr-prof">' + (s.proficient ? "●" : "○") + '</span>' +
          '<b>' + k + '</b><strong>' + signed(s.bonus) + '</strong></div>';
      }).join("");
    }
    function printSpellPage(pc) {
      const list = pc.spellList || [];
      if (!list.length) return "";
      const sc = pc.spellcasting || {};
      const slots = sc.slots || {};
      const groups = {};
      list.forEach(spell => {
        const key = Number(spell.level) === 0 ? "Cantrips" : "Level " + spell.level;
        (groups[key] = groups[key] || []).push(spell);
      });
      const slotLine = Object.keys(slots).map(level => "L" + level + " × " + slots[level]).join(" · ");
      return '<article class="print-only pr-page pr-spell-page">' +
        '<header class="pr-spell-head">' +
          '<div><p class="pr-kicker">ONE-SHOT FORGE · SPELLS</p><h2>' + esc(pc.name) + '</h2>' +
          '<p>' + esc(characterClass(pc)) + ' 4 · ' + esc(pc.race) + '</p></div>' +
          '<div class="pr-caster-stats">' +
            '<span><small>Ability</small><b>' + esc(sc.ability || "—") + '</b></span>' +
            '<span><small>Save DC</small><b>' + esc(sc.saveDC ?? "—") + '</b></span>' +
            '<span><small>Attack</small><b>' + signed(sc.attack) + '</b></span>' +
          '</div>' +
        '</header>' +
        '<div class="pr-slotbar"><b>Spell slots</b> ' + esc(slotLine || "None") +
          (sc.prepareCount ? ' · <b>Prepared/Known</b> ' + esc(sc.prepareCount) : '') + '</div>' +
        '<div class="pr-spell-columns">' +
          Object.entries(groups).map(([group, spells]) =>
            '<section class="pr-spell-group"><h3>' + esc(group) + '</h3>' +
            spells.map(spell => '<div class="pr-spell">' +
              '<div class="pr-spell-title"><b>' + esc(spell.name) + '</b><span>' +
                esc(spell.time || "") + (spell.range ? ' · ' + esc(spell.range) : '') +
                (spell.save ? ' · ' + esc(spell.save) : '') + '</span></div>' +
              '<p>' + esc(spell.effect || "") + '</p></div>').join("") +
            '</section>'
          ).join("") +
        '</div>' +
      '</article>';
    }
    function printMainPage(pc) {
      const prof = pc.proficiencies || {};
      const pers = pc.personality || {};
      const img = pc.portrait
        ? '<img class="pr-port" src="' + esc(pc.portrait) + '" alt="Portrait of ' + esc(pc.name) + '">'
        : '<div class="pr-port ph"></div>';
      return '<article class="print-only pr-page pr-main-page">' +
        '<header class="pr-head">' + img +
          '<div class="pr-id"><p class="pr-kicker">ONE-SHOT FORGE · PLAYER CHARACTER</p>' +
            '<h2>' + esc(pc.name) + '</h2>' +
            '<p><b>' + esc(characterClass(pc)) + ' 4</b> · ' + esc(pc.race) + ' · ' +
              esc(pc.background || "") + ' · ' + esc(pc.alignment || "") + '</p>' +
            '<p class="pr-role">' + esc(pc.role || "") + '</p></div>' +
          '<div class="pr-vitals">' +
            '<span><small>AC</small><b>' + esc(pc.ac) + '</b></span>' +
            '<span><small>Max HP</small><b>' + esc(pc.hp) + '</b></span>' +
            '<span><small>Init</small><b>' + signed(pc.initiative) + '</b></span>' +
            '<span><small>Speed</small><b>' + esc(pc.speedFt || pc.speed) + '</b></span>' +
            '<span><small>Prof</small><b>+' + esc(pc.proficiency || 2) + '</b></span>' +
            '<span><small>Passive Per</small><b>' + esc(pc.passivePerception) + '</b></span>' +
          '</div>' +
        '</header>' +
        '<div class="pr-body">' +
          '<aside class="pr-left">' +
            '<section><h3>Abilities</h3><div class="pr-abilities">' + scoreCol(pc) + '</div></section>' +
            '<section><h3>Saving Throws — All Six</h3><div class="pr-saves">' + fullSaveRows(pc) + '</div></section>' +
            '<section><h3>Skills</h3>' + skillRows(pc.skillsMap) + '</section>' +
          '</aside>' +
          '<main class="pr-center">' +
            '<section class="pr-combat-track"><h3>Combat Tracker</h3>' +
              '<div class="pr-track-grid">' +
                '<span><small>Current HP</small><b>________</b></span>' +
                '<span><small>Temp HP</small><b>________</b></span>' +
                '<span><small>Hit Dice</small><b>' + esc(pc.hitDice || "—") + '</b></span>' +
                '<span><small>Death Saves</small><b>✓ □□□  ✕ □□□</b></span>' +
              '</div>' +
              '<p class="pr-ac-note"><b>AC:</b> ' + esc(pc.ac) + (pc.acNotes ? ' — ' + esc(pc.acNotes) : '') + '</p>' +
            '</section>' +
            '<section><h3>Attacks & Cantrips</h3>' + attackTable(pc.attackList) + '</section>' +
            (pc.bonusActions?.length ? '<section><h3>Bonus Actions</h3>' + compactList(pc.bonusActions) + '</section>' : '') +
            (pc.reactions?.length ? '<section><h3>Reactions</h3>' + compactList(pc.reactions) + '</section>' : '') +
            '<section><h3>Limited-Use Resources</h3><div class="pr-resources">' + limitedUseRows(pc) + '</div></section>' +
            '<section><h3>Features & Traits</h3><div class="pr-features">' + printFeatureRows(pc) + '</div></section>' +
          '</main>' +
          '<aside class="pr-right">' +
            '<section><h3>Senses & Passives</h3><p><b>Darkvision</b> ' + esc(pc.darkvision || 0) + ' ft.</p>' +
              '<p><b>Passive Perception</b> ' + esc(pc.passivePerception ?? "—") + '</p>' +
              '<p><b>Passive Insight</b> ' + esc(pc.passiveInsight ?? "—") + '</p></section>' +
            '<section><h3>Proficiencies</h3>' +
              '<p><b>Armor</b> ' + esc((prof.armor || []).join(", ") || "none") + '</p>' +
              '<p><b>Weapons</b> ' + esc((prof.weapons || []).join(", ") || "none") + '</p>' +
              '<p><b>Tools</b> ' + esc((prof.tools || []).join(", ") || "—") + '</p>' +
              '<p><b>Languages</b> ' + esc((prof.languages || []).join(", ") || "—") + '</p></section>' +
            '<section><h3>Equipment</h3><p>' + esc(pc.gear || "—") + '</p></section>' +
            '<section><h3>Character</h3>' +
              '<p><b>Trait</b> ' + esc(pers.trait || "—") + '</p>' +
              '<p><b>Ideal</b> ' + esc(pers.ideal || "—") + '</p>' +
              '<p><b>Bond</b> ' + esc(pers.bond || "—") + '</p>' +
              '<p><b>Flaw</b> ' + esc(pers.flaw || "—") + '</p>' +
              (pc.appearance ? '<p class="pr-appearance">' + esc(pc.appearance) + '</p>' : '') +
            '</section>' +
          '</aside>' +
        '</div>' +
      '</article>';
    }
    function printPacket(pc) {
      return printMainPage(pc) + printSpellPage(pc);
    }

    const edition = (typeof getRuleset === "function" && getRuleset() === "2024") ? "2024" : "2014";
    const packUrl = edition === "2024"
      ? "data/pregens/quiet-seals-level-4-2024-srd.json?v=m"
      : "data/pregens/quiet-seals-level-4-2014-srd.json?v=m";
    fetch(packUrl)
      .then(r => r.json())
      .then(pack => {
        const rec = (pack.characters || []).filter(pc => pc.recommended);
        const rest = (pack.characters || []).filter(pc => !pc.recommended);
        const params = new URLSearchParams(location.search);
        const printing = params.get("print") === "1";
        const requestedPc = params.get("pc");
        const allCharacters = pack.characters || [];
        const selected = requestedPc ? allCharacters.filter(pc => pc.id === requestedPc) : rec;
        if (requestedPc && !selected.length) throw new Error("Unknown pregen: " + requestedPc);
        const screenHtml =
          rec.map(sheetHtml).join("") +
          (edition === "2024"
            ? '<p class="print-hide" style="padding:1rem 1.5rem">The extra six classes are still 2014-only. Tonight’s table is these six.</p>'
            : '<h2 class="print-hide" style="padding:1rem 1.5rem 0">The other six, if you need them</h2>' + rest.map(sheetHtml).join(""));
        const printHtml = selected.map(printPacket).join("");
        document.getElementById("sheets").innerHTML = screenHtml + printHtml;
        document.body.classList.toggle("printing-packet", printing);
        autoPrintIfRequested();
      })
      .catch(() => { document.getElementById("sheets").innerHTML = "<p>Could not load pregens.</p>"; });
  </script>
</body>
</html>
