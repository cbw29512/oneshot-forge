<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>One-Shot Forge — Character sheets</title>
  <link rel="icon" href="assets/mark-lantern.jpg">
  <link rel="stylesheet" href="styles.css?v=20261006a">
</head>
<body class="sheets-page">
  <header class="land-bar print-hide">
    <a class="brand" href="./">
      <img src="assets/mark-lantern.jpg" alt="" width="36" height="36">
      <span>One-Shot Forge</span>
    </a>
    <nav class="land-nav">
      <span id="ruleset-host"></span>
      <a href="./">Home</a>
      <a href="campaign.html">Town</a>
      <a href="run.html">GM table</a>
      <button class="button ember small" type="button" onclick="printAllCharacters()">Print all</button>
    </nav>
  </header>
  <main class="sheets-wrap">
    <section class="print-hide land-section" style="border-top:0">
      <p class="eyebrow ember">Table-complete · 2014 SRD · level 4</p>
      <h1>Character sheets</h1>
      <p class="lede short">Click <b>2014 SRD</b> or <b>2024 SRD</b> at the top. The Quiet Seals six are the default. An Oakhaven module link loads that module’s four heroes instead. Beyond cannot import them. Print them.</p>
    </section>
    <div id="sheets"></div>
  </main>
  <script src="rules.js?v=20260920n"></script>
  <script>mountRulesetToggle(document.getElementById("ruleset-host"));</script>
  <script>
    function waitImagesThenPrint(root) {
      const imgs = [...(root || document).querySelectorAll("img")];
      const pending = imgs.filter(i => !i.complete);
      let done = false;
      const go = () => { if (done) return; done = true; window.print(); };
      if (!pending.length) { setTimeout(go, 100); return; }
      let n = pending.length;
      const tick = () => { if (--n <= 0) go(); };
      pending.forEach(i => { i.addEventListener("load", tick, { once:true }); i.addEventListener("error", tick, { once:true }); });
      setTimeout(go, 2500);
    }
    function setPrintTarget(target) {
      document.body.dataset.printTarget = target || "all";
    }
    function clearPrintTarget() {
      delete document.body.dataset.printTarget;
    }
    function printAllCharacters() {
      setPrintTarget("all");
      waitImagesThenPrint(document.getElementById("sheets"));
    }
    function printCharacter(id) {
      setPrintTarget(id);
      waitImagesThenPrint(document.getElementById("sheets"));
    }
    window.addEventListener("afterprint", clearPrintTarget);
    const ABIL = ["STR","DEX","CON","INT","WIS","CHA"];
    const SKILL_ORDER = [
      "acrobatics","animal handling","arcana","athletics","deception","history",
      "insight","intimidation","investigation","medicine","nature","perception",
      "performance","persuasion","religion","sleight of hand","stealth","survival"
    ];
    function esc(v) {
      return String(v == null ? "" : v)
        .replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">");
    }
    function signed(n) {
      n = Number(n) || 0;
      return (n >= 0 ? "+" : "") + n;
    }
    function mod(score) { return Math.floor(((Number(score) || 10) - 10) / 2); }
    function skillRows(map) {
      if (!map) return "";
      return SKILL_ORDER.map(name => {
        const s = map[name] || {};
        const mark = s.expertise ? "●●" : s.proficient ? "●" : "○";
        return '<div class="sk' + (s.proficient ? " on" : "") + '"><i>' + mark +
          "</i><b>" + signed(s.bonus) + "</b><span>" + name + "</span></div>";
      }).join("");
    }
    function saveRows(map, scores) {
      return ABIL.map(k => {
        const s = (map && map[k]) || { bonus: mod((scores||{})[k]), proficient: false };
        return '<div class="sv' + (s.proficient ? " on" : "") + '"><i>' +
          (s.proficient ? "●" : "○") + "</i><b>" + signed(s.bonus) + "</b><span>" + k + "</span></div>";
      }).join("");
    }
    function scoreCol(pc) {
      return ABIL.map(k => {
        const score = (pc.scores || {})[k];
        return '<div class="ab">' +
          '<span class="ab-name">' + k + '</span>' +
          '<strong class="ab-score">' + esc(score) + '</strong>' +
          '<em class="ab-mod">' + signed(mod(score)) + '</em>' +
        '</div>';
      }).join("");
    }
    function attackTable(list) {
      if (!list || !list.length) return "";
      return '<table class="atk"><thead><tr><th>Attack</th><th>Hit</th><th>Damage</th></tr></thead><tbody>' +
        list.map(a => "<tr><td>" + esc(a.name) + (a.notes ? '<div class="tiny">' + esc(a.notes) + "</div>" : "") +
          "</td><td>" + signed(a.bonus) + "</td><td>" + esc(a.damage) + " " + esc(a.type) + "</td></tr>").join("") +
        "</tbody></table>";
    }
    function listBlock(title, arr) {
      if (!arr || !arr.length) return "";
      return "<h3>" + esc(title) + "</h3><ul>" + arr.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>";
    }
    function spellBlock(pc) {
      const list = pc.spellList;
      if (!list || !list.length) return "";
      const sc = pc.spellcasting || {};
      const slots = sc.slots || {};
      const slotLine = Object.keys(slots).map(l => "L" + l + " × " + slots[l]).join(" · ");
      const groups = {};
      list.forEach(s => {
        const k = s.level === 0 ? "Cantrips" : "Level " + s.level;
        (groups[k] = groups[k] || []).push(s);
      });
      let html = '<section class="cs-spells"><h3>Spellcasting</h3><p class="cs-slot">' +
        esc(sc.ability || "") + " · DC " + esc(sc.saveDC) + " · attack " + signed(sc.attack) +
        (slotLine ? " · slots " + esc(slotLine) : "") +
        (sc.prepareCount ? '<span class="tiny"> · ' + esc(sc.prepareCount) + "</span>" : "") +
        "</p>";
      for (const [k, arr] of Object.entries(groups)) {
        html += "<h4>" + esc(k) + "</h4>";
        html += arr.map(s => '<div class="spl"><b>' + esc(s.name) + "</b> <span>" +
          esc(s.time) + " · " + esc(s.range) +
          (s.save ? " · " + esc(s.save) : "") +
          "</span><p>" + esc(s.effect) + "</p></div>").join("");
      }
      return html + "</section>";
    }
    function characterClass(pc) {
      return pc.className || pc.class || "Adventurer";
    }
    function beyondList(pc) {
      const sk = pc.skillsMap || {};
      const profSkills = Object.keys(sk).filter(k => sk[k].proficient).join(", ");
      const spells = (pc.spellList || []).map(s => s.name).join(", ");
      return [
        "D&D Beyond has no character import. Type this by hand if you must.",
        "Species: " + (pc.race || ""),
        "Class: " + characterClass(pc) + " " + (pc.level || 4),
        "Background: " + (pc.background || ""),
        "Scores: " + ABIL.map(k => k + " " + (pc.scores||{})[k]).join(", "),
        "Skills: " + profSkills,
        spells ? "Spells: " + spells : ""
      ].filter(Boolean).join("\n");
    }
    function sheetHtml(pc) {
      const prof = pc.proficiencies || {};
      const pers = pc.personality || {};
      const img = pc.portrait
        ? '<img class="pr-port" src="' + esc(pc.portrait) + '" alt="Portrait of ' + esc(pc.name) + '">'
        : '<div class="pr-port ph" aria-hidden="true"></div>';
      const printAction = "printCharacter(" + JSON.stringify(pc.id) + ")";
      const bonus = pc.bonusActions?.length ? compactList(pc.bonusActions) : '<div class="pr-line">No special bonus action.</div>';
      const reactions = pc.reactions?.length ? compactList(pc.reactions) : '<div class="pr-line">Opportunity Attack when triggered.</div>';
      return '<article class="screen-sheet web-fixed-sheet" id="' + esc(pc.id) + '">' +
        '<div class="cs-screen-actions print-hide"><button class="button small secondary" type="button" onclick=\'' + esc(printAction) + '\'>Print this character</button></div>' +
        '<header class="pr-head">' + img +
          '<div class="pr-id"><p class="pr-kicker">ONE-SHOT FORGE · PLAYER CHARACTER</p>' +
            '<h2>' + esc(pc.name) + '</h2>' +
            '<p><b>' + esc(characterClass(pc)) + ' ' + esc(pc.level || 4) + '</b> · ' + esc(pc.race) + ' · ' +
              esc(pc.background || "") + ' · ' + esc(pc.alignment || "") + '</p>' +
            '<p class="pr-subid">' + esc(pc.rules || "5E") + ' · XP ' + esc(pc.xp ?? "Milestone") + '</p>' +
            '<p class="pr-role">' + esc(pc.role || "") + '</p></div>' +
          '<div class="pr-vitals">' +
            '<span><small>AC</small><b>' + esc(pc.ac) + '</b></span>' +
            '<span><small>Max HP</small><b>' + esc(pc.hp) + '</b></span>' +
            '<span><small>Init</small><b>' + signed(pc.initiative) + '</b></span>' +
            '<span><small>Speed</small><b>' + esc(pc.speedFt || pc.speed) + '</b></span>' +
            '<span><small>Prof</small><b>+' + esc(pc.proficiency || 2) + '</b></span>' +
            '<span><small>Passive Per</small><b>' + esc(pc.passivePerception) + '</b></span>' +
          '</div>' +
        '</header>' +
        '<div class="pr-fixed-grid">' +
          '<section class="pr-zone pr-zone-abilities"><h3>Abilities</h3><div class="pr-abilities">' + scoreCol(pc) + '</div></section>' +
          '<section class="pr-zone pr-zone-saves"><h3>Saving Throws — All Six</h3><div class="pr-saves">' + fullSaveRows(pc) + '</div></section>' +
          '<section class="pr-zone pr-zone-skills"><h3>Skills</h3><div class="pr-skill-list">' + skillRows(pc.skillsMap) + '</div></section>' +

          '<section class="pr-zone pr-zone-tracker"><h3>Combat Tracker</h3>' +
            '<div class="pr-hp-grid">' +
              '<div class="pr-writebox pr-current-hp"><small>Current HP</small><b></b></div>' +
              '<div class="pr-writebox pr-temp-hp"><small>Temp HP</small><b></b></div>' +
              '<div class="pr-writebox pr-hit-dice"><small>Hit Dice</small><b>' + esc(pc.hitDice || "—") + '</b><span>Spent: ' + Array.from({length:Number(pc.level)||4},()=>"□").join(" ") + '</span></div>' +
              '<div class="pr-writebox pr-death"><small>Death Saves</small><span>Success ○ ○ ○</span><span>Failure ○ ○ ○</span></div>' +
            '</div>' +
            '<div class="pr-condition-box"><small>Conditions / Concentration / Combat Notes</small><div></div><div></div></div>' +
            '<div class="pr-mini-stats">' +
              '<span><small>Heroic Inspiration</small><b>○</b></span>' +
              '<span><small>Class / Spell Save DC</small><b>' + esc(classSaveDC(pc)) + '</b></span>' +
            '</div>' +
            '<p class="pr-ac-note"><b>AC:</b> ' + esc(pc.ac) + (pc.acNotes ? ' — ' + esc(pc.acNotes) : '') + '</p>' +
          '</section>' +

          '<section class="pr-zone pr-zone-attacks"><h3>Attacks & Combat Cantrips</h3>' + printAttackTable(pc.attackList) +
            (pc.spellcasting ? '<div class="pr-casting-grid pr-inline-casting">' +
              '<span><small>Spell Ability</small><b>' + esc(pc.spellcasting.ability || "—") + '</b></span>' +
              '<span><small>Save DC</small><b>' + esc(pc.spellcasting.saveDC ?? "—") + '</b></span>' +
              '<span><small>Spell Attack</small><b>' + signed(pc.spellcasting.attack) + '</b></span>' +
            '</div>' : '') +
          '</section>' +

          '<section class="pr-zone pr-zone-actions"><h3>Action Economy</h3>' +
            '<div class="pr-standard-actions"><b>Standard Actions</b> ' + esc(standardActionLine()) + '</div>' +
            '<div class="pr-action-split"><div><h4>Bonus Actions</h4>' + bonus + '</div><div><h4>Reactions</h4>' + reactions + '</div></div>' +
            '<h4>Quick Turn</h4>' + quickTurn(pc) +
          '</section>' +

          '<section class="pr-zone pr-zone-resources"><h3>Resources & Defenses</h3>' +
            '<div class="pr-resource-columns"><div>' + limitedUseRows(pc) + '</div><div>' + combatDefenseRows(pc) + '</div></div>' +
          '</section>' +

          '<section class="pr-zone pr-zone-side"><h3>Senses / Training / Gear</h3>' +
            '<p><b>Senses</b> Darkvision ' + esc(pc.darkvision || 0) + ' ft.</p>' +
            '<p><b>Passive Perception</b> ' + esc(pc.passivePerception ?? "—") + '</p>' +
            '<p><b>Passive Insight</b> ' + esc(pc.passiveInsight ?? passiveSkill(pc,"insight")) + '</p>' +
            '<p><b>Passive Investigation</b> ' + esc(passiveSkill(pc,"investigation")) + '</p>' +
            '<p><b>Armor</b> ' + esc((prof.armor || []).join(", ") || "none") + '</p>' +
            '<p><b>Weapons</b> ' + esc((prof.weapons || []).join(", ") || "none") + '</p>' +
            '<p><b>Tools</b> ' + esc((prof.tools || []).join(", ") || "—") + '</p>' +
            '<p><b>Languages</b> ' + esc((prof.languages || []).join(", ") || "—") + '</p>' +
            '<p><b>Equipment</b> ' + esc(pc.gear || "—") + '</p>' +
          '</section>' +

          '<section class="pr-zone pr-zone-character"><h3>Character</h3>' +
            '<p><b>Trait</b> ' + esc(pers.trait || "—") + '</p>' +
            '<p><b>Ideal</b> ' + esc(pers.ideal || "—") + '</p>' +
            '<p><b>Bond</b> ' + esc(pers.bond || "—") + '</p>' +
            '<p><b>Flaw</b> ' + esc(pers.flaw || "—") + '</p>' +
          '</section>' +

          '<section class="pr-zone pr-zone-features"><h3>Features & Traits</h3><div class="pr-features">' + printFeatureRows(pc) + '</div>' +
            (isFeatureHeavy(pc) ? compactRoleplay(pc) : '') +
          '</section>' +
        '</div>' +
        '<div class="web-spells">' + spellBlock(pc) + '</div>' +
        '<pre class="beyond-check print-hide">' + esc(beyondList(pc)) + '</pre>' +
      '</article>';
    }

    function compactList(arr) {
      if (!arr || !arr.length) return '<span class="dash">—</span>';
      return arr.map(x => '<div class="pr-line">' + esc(x) + '</div>').join("");
    }
    function printFeatureRows(pc) {
      return (pc.featureList || []).map(f =>
        '<div class="pr-feature"><b>' + esc(f.name) + '</b>' +
        (f.uses ? '<span> · ' + esc(f.uses) + '</span>' : '') +
        '<p>' + esc(f.text) + '</p></div>'
      ).join("");
    }
    function resourceBoxes(uses) {
      const text = String(uses || "");
      const match = text.match(/\b([1-9])\s*(?:\/|uses?|points?|ki\b)/i);
      if (match) return Array(Number(match[1])).fill("□").join(" ");
      const pool = text.match(/\b(\d+)\s*(?:HP pool|points?)/i);
      if (pool) return "Current ______ / " + pool[1];
      return "□";
    }
    function limitedUseRows(pc) {
      const seen = new Set();
      const rows = [];
      for (const feature of (pc.featureList || [])) {
        const uses = String(feature.uses || "").trim();
        if (!uses || /already applied|passive|at will/i.test(uses)) continue;
        const key = feature.name + "|" + uses;
        if (seen.has(key)) continue;
        seen.add(key);
        rows.push('<div class="pr-resource"><b>' + esc(feature.name) + '</b><span>' + esc(uses) + '</span><em>' + esc(resourceBoxes(uses)) + '</em></div>');
      }
      return rows.length ? rows.join("") : '<div class="pr-line">No limited-use class resource to track.</div>';
    }
    function combatDefenseRows(pc) {
      const rx = /(resistan|immune|advantage on saves|disadvantage.*attack|reduce .*damage|drop to 1 hp|armor class|\bac\b|deflect|danger sense|brave|fey ancestry|relentless endurance|unarmored defense)/i;
      const rows = (pc.featureList || []).filter(f => rx.test((f.name || "") + " " + (f.text || "")));
      return rows.length
        ? rows.map(f => '<div class="pr-defense"><b>' + esc(f.name) + '</b><p>' + esc(f.text) + '</p></div>').join("")
        : '<div class="pr-line">No special combat defenses beyond AC and saving throws.</div>';
    }
    function printAttackTable(list) {
      if (!list || !list.length) return '<div class="pr-line">No listed attacks.</div>';
      return '<table class="atk pr-atk"><thead><tr><th>Attack</th><th>Roll / DC</th><th>Damage</th></tr></thead><tbody>' +
        list.map(a => {
          const notes = String(a.notes || "");
          const dc = notes.match(/\b(?:Str|Dex|Con|Int|Wis|Cha)\s+DC\s+\d+/i);
          const roll = dc ? dc[0] : signed(a.bonus);
          return '<tr><td><b>' + esc(a.name) + '</b>' +
            (notes ? '<div class="tiny">' + esc(notes) + '</div>' : '') +
            '</td><td>' + esc(roll) + '</td><td>' + esc(a.damage) + ' ' + esc(a.type) + '</td></tr>';
        }).join("") + '</tbody></table>';
    }
    function fullSaveRows(pc) {
      return ABIL.map(k => {
        const score = (pc.scores || {})[k];
        const s = (pc.saveMap && pc.saveMap[k]) || { bonus: mod(score), proficient: false };
        return '<div class="pr-save"><span class="pr-prof">' + (s.proficient ? "●" : "○") + '</span>' +
          '<b>' + k + '</b><strong>' + signed(s.bonus) + '</strong></div>';
      }).join("");
    }
    function quickTurn(pc) {
      const cls = characterClass(pc).toLowerCase();
      const steps = [];
      if (cls.includes("fighter")) steps.push("Move into position.", "Attack with your best weapon.", "Use Action Surge when a dangerous target must go down.", "Use Second Wind when badly hurt.");
      else if (cls.includes("rogue")) steps.push("Get Sneak Attack by attacking from hiding or beside an ally.", "Attack once with rapier/shortbow.", "Use Cunning Action to Hide, Dash, or Disengage.", "Reposition before enemies pin you down.");
      else if (cls.includes("cleric")) steps.push("Cast Bless early if several allies will attack or save.", "Use Spiritual Weapon for bonus-action damage.", "Use Sacred Flame or weapon attacks while concentrating.", "Keep Healing Word / Preserve Life for emergencies.");
      else if (cls.includes("wizard")) steps.push("Use control/AoE when enemies cluster.", "Use Fire Bolt when conserving slots.", "Keep Shield available as your reaction.", "Use Misty Step if trapped or threatened.");
      else if (cls.includes("ranger")) steps.push("Mark the priority target with Hunter’s Mark.", "Attack with longbow from range.", "Add Colossus Slayer once per turn when the target is wounded.", "Reposition to preserve range and cover.");
      else if (cls.includes("paladin")) steps.push("Close to melee and attack with longsword.", "Use Divine Smite on an important hit.", "Use Lay on Hands for reliable emergency healing.", "Use Sacred Weapon before a longer fight.");
      else steps.push("Choose your strongest legal action.", "Use bonus actions and reactions when their triggers appear.", "Track limited resources.", "Reposition before ending your turn.");
      return '<ol class="pr-quickturn">' + steps.map(s => '<li>' + esc(s) + '</li>').join("") + '</ol>';
    }
    function passiveSkill(pc, name) {
      const skill = pc.skillsMap?.[name];
      return skill && typeof skill.bonus === "number" ? 10 + skill.bonus : "—";
    }
    function classSaveDC(pc) {
      if (pc.spellcasting?.saveDC != null) return pc.spellcasting.saveDC;
      const featureText = (pc.featureList || []).map(f => (f.name || "") + " " + (f.text || "")).join(" ");
      const m = featureText.match(/\b(?:Str|Dex|Con|Int|Wis|Cha)?\s*DC\s*(\d+)\b/i);
      return m ? m[1] : "—";
    }
    function standardActionLine() {
      return "Attack · Dash · Disengage · Dodge · Help · Hide · Ready · Search · Use an Object";
    }
    function spellRole(spell) {
      const text = ((spell.name || "") + " " + (spell.effect || "")).toLowerCase();
      if (/heal|restore|hit points|stabil/.test(text)) return "Healing";
      if (/armor class|\+5 ac|sanctuary|protection|resistan|immune|disadvantage to hit|shield/.test(text)) return "Defense";
      if (/paraly|turned|control|disadvantage|teleport|mark|bless|advantage|concentration/.test(text) && !/damage|d6|d8|d10|d12/.test(text)) return "Control";
      if (/damage|d6|d8|d10|d12|radiant|fire|force|thunder|piercing|slashing/.test(text)) return "Damage";
      return "Utility";
    }
    function printSpellPage(pc) {
      const list = pc.spellList || [];
      if (!list.length) return "";
      const sc = pc.spellcasting || {};
      const slots = sc.slots || {};
      const groups = {};
      list.forEach(spell => {
        const key = spellRole(spell);
        (groups[key] = groups[key] || []).push(spell);
      });
      const slotLine = Object.keys(slots).map(level => "L" + level + " × " + slots[level]).join(" · ");
      return '<article class="print-only pr-page pr-spell-page" data-print-pc="' + esc(pc.id) + '">' +
        '<header class="pr-spell-head">' +
          '<div><p class="pr-kicker">ONE-SHOT FORGE · SPELLS</p><h2>' + esc(pc.name) + '</h2>' +
          '<p>' + esc(characterClass(pc)) + ' ' + esc(pc.level ?? 4) + ' · ' + esc(pc.race) + '</p></div>' +
          '<div class="pr-caster-stats">' +
            '<span><small>Ability</small><b>' + esc(sc.ability || "—") + '</b></span>' +
            '<span><small>Save DC</small><b>' + esc(sc.saveDC ?? "—") + '</b></span>' +
            '<span><small>Attack</small><b>' + signed(sc.attack) + '</b></span>' +
          '</div>' +
        '</header>' +
        '<div class="pr-slotbar"><b>Spell slots</b> ' + esc(slotLine || "None") +
          (sc.prepareCount ? ' · <b>Prepared/Known</b> ' + esc(sc.prepareCount) : '') + '</div>' +
        '<div class="pr-spell-columns">' +
          ["Damage","Control","Healing","Defense","Utility"].filter(group => groups[group]?.length).map(group => {
            const spells = groups[group];
            return '<section class="pr-spell-group"><h3>' + esc(group) + '</h3>' +
            spells.map(spell => {
              const effect = String(spell.effect || "");
              const conc = /concentration/i.test(effect) ? "Concentration" : "";
              const durationMatch = effect.match(/\b(?:1 minute|10 minutes|1 hour|8 hours|24 hours|until your next turn|until the start of your next turn)\b/i);
              const meta = [
                Number(spell.level) === 0 ? "Cantrip" : "L" + spell.level,
                spell.time || "",
                spell.range || "",
                spell.save || "",
                conc,
                durationMatch ? durationMatch[0] : ""
              ].filter(Boolean).join(" · ");
              return '<div class="pr-spell">' +
                '<div class="pr-spell-title"><b>' + esc(spell.name) + '</b><span>' + esc(meta) + '</span></div>' +
                '<p>' + esc(effect) + '</p></div>';
            }).join("") +
            '</section>';
          }).join("") +
        '</div>' +
      '</article>';
    }
    function featureWeight(pc) {
      return (pc.featureList || []).reduce((sum, feature) =>
        sum + String(feature.name || "").length + String(feature.text || "").length, 0);
    }
    function isFeatureHeavy(pc) {
      return (pc.featureList || []).length >= 8 || featureWeight(pc) >= 950;
    }
    function limitedUseCount(pc) {
      return (pc.featureList || []).filter(feature => {
        const uses = String(feature.uses || "").trim();
        return uses && !/already applied|passive|at will/i.test(uses);
      }).length;
    }
    function isResourceHeavy(pc) {
      return limitedUseCount(pc) >= 4;
    }
    function compactRoleplay(pc) {
      const p = pc.personality || {};
      return '<div class="pr-roleplay-compact">' +
        '<b>Roleplay</b> · ' +
        '<span><strong>Trait:</strong> ' + esc(p.trait || "—") + '</span> · ' +
        '<span><strong>Ideal:</strong> ' + esc(p.ideal || "—") + '</span> · ' +
        '<span><strong>Bond:</strong> ' + esc(p.bond || "—") + '</span> · ' +
        '<span><strong>Flaw:</strong> ' + esc(p.flaw || "—") + '</span>' +
      '</div>';
    }
    function printMainPage(pc) {
      const prof = pc.proficiencies || {};
      const pers = pc.personality || {};
      const img = pc.portrait
        ? '<img class="pr-port" src="' + esc(pc.portrait) + '" alt="Portrait of ' + esc(pc.name) + '">'
        : '<div class="pr-port ph"></div>';
      const bonus = pc.bonusActions?.length ? compactList(pc.bonusActions) : '<div class="pr-line">No special bonus action.</div>';
      const reactions = pc.reactions?.length ? compactList(pc.reactions) : '<div class="pr-line">Opportunity Attack when triggered.</div>';
      const heavyClass = isFeatureHeavy(pc) ? " pr-feature-heavy" : "";
      const resourceClass = isResourceHeavy(pc) ? " pr-resource-heavy" : "";
      return '<article class="print-only pr-page pr-main-page pr-fixed-sheet' + heavyClass + resourceClass + '" data-print-pc="' + esc(pc.id) + '">' +
        '<header class="pr-head">' + img +
          '<div class="pr-id"><p class="pr-kicker">ONE-SHOT FORGE · PLAYER CHARACTER</p>' +
            '<h2>' + esc(pc.name) + '</h2>' +
            '<p><b>' + esc(characterClass(pc)) + ' ' + esc(pc.level || 4) + '</b> · ' + esc(pc.race) + ' · ' +
              esc(pc.background || "") + ' · ' + esc(pc.alignment || "") + '</p>' +
            '<p class="pr-subid">' + esc(pc.rules || "5E") + ' · XP ' + esc(pc.xp ?? "Milestone") + '</p>' +
            '<p class="pr-role">' + esc(pc.role || "") + '</p></div>' +
          '<div class="pr-vitals">' +
            '<span><small>AC</small><b>' + esc(pc.ac) + '</b></span>' +
            '<span><small>Max HP</small><b>' + esc(pc.hp) + '</b></span>' +
            '<span><small>Init</small><b>' + signed(pc.initiative) + '</b></span>' +
            '<span><small>Speed</small><b>' + esc(pc.speedFt || pc.speed) + '</b></span>' +
            '<span><small>Prof</small><b>+' + esc(pc.proficiency || 2) + '</b></span>' +
            '<span><small>Passive Per</small><b>' + esc(pc.passivePerception) + '</b></span>' +
          '</div>' +
        '</header>' +
        '<div class="pr-fixed-grid">' +
          '<section class="pr-zone pr-zone-abilities"><h3>Abilities</h3><div class="pr-abilities">' + scoreCol(pc) + '</div></section>' +
          '<section class="pr-zone pr-zone-saves"><h3>Saving Throws — All Six</h3><div class="pr-saves">' + fullSaveRows(pc) + '</div></section>' +
          '<section class="pr-zone pr-zone-skills"><h3>Skills</h3><div class="pr-skill-list">' + skillRows(pc.skillsMap) + '</div></section>' +

          '<section class="pr-zone pr-zone-tracker"><h3>Combat Tracker</h3>' +
            '<div class="pr-hp-grid">' +
              '<div class="pr-writebox pr-current-hp"><small>Current HP</small><b></b></div>' +
              '<div class="pr-writebox pr-temp-hp"><small>Temp HP</small><b></b></div>' +
              '<div class="pr-writebox pr-hit-dice"><small>Hit Dice</small><b>' + esc(pc.hitDice || "—") + '</b><span>Spent: ' + Array.from({length:Number(pc.level)||4},()=>"□").join(" ") + '</span></div>' +
              '<div class="pr-writebox pr-death"><small>Death Saves</small><span>Success ○ ○ ○</span><span>Failure ○ ○ ○</span></div>' +
            '</div>' +
            '<div class="pr-condition-box"><small>Conditions / Concentration / Combat Notes</small><div></div><div></div></div>' +
            '<div class="pr-mini-stats">' +
              '<span><small>Heroic Inspiration</small><b>○</b></span>' +
              '<span><small>Class / Spell Save DC</small><b>' + esc(classSaveDC(pc)) + '</b></span>' +
            '</div>' +
            '<p class="pr-ac-note"><b>AC:</b> ' + esc(pc.ac) + (pc.acNotes ? ' — ' + esc(pc.acNotes) : '') + '</p>' +
          '</section>' +

          '<section class="pr-zone pr-zone-attacks"><h3>Attacks & Combat Cantrips</h3>' + printAttackTable(pc.attackList) +
            (pc.spellcasting ? '<div class="pr-casting-grid pr-inline-casting">' +
              '<span><small>Spell Ability</small><b>' + esc(pc.spellcasting.ability || "—") + '</b></span>' +
              '<span><small>Save DC</small><b>' + esc(pc.spellcasting.saveDC ?? "—") + '</b></span>' +
              '<span><small>Spell Attack</small><b>' + signed(pc.spellcasting.attack) + '</b></span>' +
            '</div>' : '') +
          '</section>' +

          '<section class="pr-zone pr-zone-actions"><h3>Action Economy</h3>' +
            '<div class="pr-standard-actions"><b>Standard Actions</b> ' + esc(standardActionLine()) + '</div>' +
            '<div class="pr-action-split"><div><h4>Bonus Actions</h4>' + bonus + '</div><div><h4>Reactions</h4>' + reactions + '</div></div>' +
            '<h4>Quick Turn</h4>' + quickTurn(pc) +
          '</section>' +

          '<section class="pr-zone pr-zone-resources"><h3>Resources & Defenses</h3>' +
            '<div class="pr-resource-columns"><div>' + limitedUseRows(pc) + '</div><div>' + combatDefenseRows(pc) + '</div></div>' +
          '</section>' +

          '<section class="pr-zone pr-zone-side"><h3>Senses / Training / Gear</h3>' +
            '<p><b>Senses</b> Darkvision ' + esc(pc.darkvision || 0) + ' ft.</p>' +
            '<p><b>Passive Perception</b> ' + esc(pc.passivePerception ?? "—") + '</p>' +
            '<p><b>Passive Insight</b> ' + esc(pc.passiveInsight ?? passiveSkill(pc,"insight")) + '</p>' +
            '<p><b>Passive Investigation</b> ' + esc(passiveSkill(pc,"investigation")) + '</p>' +
            '<p><b>Armor</b> ' + esc((prof.armor || []).join(", ") || "none") + '</p>' +
            '<p><b>Weapons</b> ' + esc((prof.weapons || []).join(", ") || "none") + '</p>' +
            '<p><b>Tools</b> ' + esc((prof.tools || []).join(", ") || "—") + '</p>' +
            '<p><b>Languages</b> ' + esc((prof.languages || []).join(", ") || "—") + '</p>' +
            '<p><b>Equipment</b> ' + esc(pc.gear || "—") + '</p>' +
          '</section>' +

          '<section class="pr-zone pr-zone-character"><h3>Character</h3>' +
            '<p><b>Trait</b> ' + esc(pers.trait || "—") + '</p>' +
            '<p><b>Ideal</b> ' + esc(pers.ideal || "—") + '</p>' +
            '<p><b>Bond</b> ' + esc(pers.bond || "—") + '</p>' +
            '<p><b>Flaw</b> ' + esc(pers.flaw || "—") + '</p>' +
          '</section>' +

          '<section class="pr-zone pr-zone-features"><h3>Features & Traits</h3><div class="pr-features">' + printFeatureRows(pc) + '</div></section>' +
        '</div>' +
      '</article>';
    }
    function printPacket(pc) {
      return printMainPage(pc) + printSpellPage(pc);
    }

    const params = new URLSearchParams(window.location.search);
    const requestedPack = params.get("pack") || "";
    const owlbearMode = requestedPack === "owlbear-arms";
    const oakhavenLevel = (/^oakhaven-([2-6])$/.exec(requestedPack) || [])[1] || "";
    const edition = owlbearMode ? "2014" : ((typeof getRuleset === "function" && getRuleset() === "2024") ? "2024" : "2014");
    const packUrl = owlbearMode
      ? "data/pregens/owlbear-arms-level-6-2014-srd-v1.2.json?v=1.2"
      : oakhavenLevel
        ? "data/pregens/oakhaven-level-" + oakhavenLevel + "-" + edition + "-srd.json?v=1"
        : edition === "2024"
        ? "data/pregens/quiet-seals-level-4-2024-srd.json?v=m"
        : "data/pregens/quiet-seals-level-4-2014-srd.json?v=m";
    if (oakhavenLevel) {
      const intro = document.querySelector(".sheets-wrap > .land-section");
      if (intro) intro.innerHTML = '<p class="eyebrow ember">Oakhaven series · level ' + oakhavenLevel + ' · ' + (edition === "2024" ? "SRD 5.2.1" : "SRD 5.1") + '</p><h1>Four series heroes</h1><p class="lede short">Calder Voss, Ness Quinn, Halden Moss, and Mira Quill, built for this module. They carry the permanent magic items earned on the best path of every earlier Oakhaven module. Use the edition toggle to switch 2014 and 2024. A table that did not play those modules can set the extra items aside.</p>';
    }
    if (owlbearMode) {
      const intro = document.querySelector(".sheets-wrap > .land-section");
      if (intro) intro.innerHTML = '<p class="eyebrow ember">Right to OwlBear Arms v1.2 · Table-complete · 2014 SRD · level 6</p><h1>Five repaired hero sheets</h1><p class="lede short">Rowan, Dagna, Sylvi, Liora, and Thalen rebuilt to the One-Shot Forge print standard: all six saves, all 18 skills, attacks, resources, combat features, and spell procedures. Print one or print all.</p>';
      const toggle = document.getElementById("ruleset-host");
      if (toggle) toggle.textContent = "2014 SRD";
    }
    fetch(packUrl)
      .then(r => r.json())
      .then(pack => {
        const rec = (pack.characters || []).filter(pc => pc.recommended);
        const rest = (pack.characters || []).filter(pc => !pc.recommended);
        const allCharacters = pack.characters || [];
        const screenHtml =
          rec.map(sheetHtml).join("") +
          (owlbearMode || oakhavenLevel
            ? rest.map(sheetHtml).join("")
            : edition === "2024"
              ? '<p class="print-hide" style="padding:1rem 1.5rem">The extra six classes are still 2014-only. Tonight’s table is these six.</p>'
              : '<h2 class="print-hide" style="padding:1rem 1.5rem 0">The other six, if you need them</h2>' + rest.map(sheetHtml).join(""));
        const printHtml = allCharacters.map(printPacket).join("");
        document.getElementById("sheets").innerHTML = screenHtml + printHtml;
        clearPrintTarget();
      })
      .catch(() => { document.getElementById("sheets").innerHTML = "<p>Could not load pregens.</p>"; });
  </script>
</body>
</html>
